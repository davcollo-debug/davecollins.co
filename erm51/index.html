<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaran Group Product Roadmap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --black: #1A1A1A;
    --white: #FFFFFF;
    --gray: #6B6B6B;
    --lightgray: #E8E8E8;
    --offwhite: #F4F4F4;
    --red: #C0392B;
    --red-bg: #FDECEA;
    --amber: #D4830A;
    --amber-bg: #FDF3DC;
    --teal: #0D7377;
    --teal-bg: #E8F4F8;
    --slate-bg: #F0F2F4;
    --rag-green: #27AE60;
    --rag-amber: #F39C12;
    --rag-red: #E74C3C;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: #F0F2F4; color: var(--black); min-height: 100vh; }

  .header {
    background: var(--white);
    border-bottom: 1px solid var(--lightgray);
    padding: 14px 24px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 0;
  }
  .header-left h1 { font-size: 16px; font-weight: 600; }
  .header-left p  { font-size: 11px; color: var(--gray); margin-top: 2px; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn-export { font-family: var(--font); font-size: 12px; font-weight: 500; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--black); background: var(--black); color: var(--white); cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .btn-export:hover { background: #333; }
  .btn-pptx { background: var(--white); color: var(--black); border-color: var(--lightgray); }
  .btn-pptx:hover { background: var(--offwhite); }
  .header-logo { height: 36px; width: auto; display: block; margin-bottom: 8px; }
  .header-center { display: flex; align-items: flex-start; padding-left: 48px; }
  .header-rag-key { font-size: 11px; color: var(--gray); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .rag-key-group { display: inline-flex; align-items: center; gap: 4px; }
  .rk-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .lens-chip { font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
  .lens-keep  { background: var(--red-bg);   color: var(--red);  }
  .lens-win   { background: var(--teal-bg);  color: var(--teal); }
  .lens-scale { background: var(--offwhite); color: var(--gray); }
  .rag-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .grid-wrap { padding: 18px 24px; overflow-x: auto; }

  .grid {
    display: grid;
    grid-template-columns: 155px 195px 207px 207px 1fr;
    border: 1px solid var(--lightgray);
    border-radius: 10px;
    overflow: hidden;
    background: var(--white);
    min-width: 780px;
    width: 100%;
  }

  .col-header {
    padding: 11px 14px;
    border-bottom: 1px solid var(--lightgray);
    border-right: 1px solid var(--lightgray);
    text-align: center;
  }
  .col-header:last-child { border-right: none; }
  .col-header.row-corner { background: var(--offwhite); }
  .col-header.col-done   { background: #EEEEEE; }
  .col-header.col-now    { background: #2C3E50; color: var(--white); }
  .col-header.col-next   { background: var(--teal-bg); }
  .col-header.col-later  { background: #F0F2F4; }
  .col-title { font-size: 13px; font-weight: 600; }
  .col-sub   { font-size: 10px; margin-top: 2px; }
  .col-now .col-sub   { color: var(--rag-amber); font-weight: 600; }
  .col-next .col-sub  { color: var(--teal); }
  .col-later .col-sub { color: #AAAAAA; }
  .col-done .col-sub  { color: var(--gray); }

  .row-header {
    padding: 14px 12px;
    border-bottom: 1px solid var(--lightgray);
    border-right: 1px solid var(--lightgray);
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  .row-header::before { content:''; position:absolute; left:0;top:0;bottom:0; width:4px; }
  .row-keep::before  { background: var(--red);  }
  .row-win::before   { background: var(--teal); }
  .row-scale::before { background: var(--gray); }
  .row-keep  { background: var(--red-bg);   }
  .row-win   { background: var(--teal-bg);  }
  .row-scale { background: var(--slate-bg); }
  .row-title { font-size: 12px; font-weight: 600; }
  .row-lens  { font-size: 10px; color: var(--gray); margin-top: 3px; font-style: italic; }
  .row-why   { font-size: 10px; color: var(--gray); margin-top: 6px; line-height: 1.45; border-top: 1px solid rgba(0,0,0,0.07); padding-top: 6px; }

  .cell {
    padding: 10px;
    border-bottom: 1px solid var(--lightgray);
    border-right: 1px solid var(--lightgray);
    min-height: 170px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--white);
    transition: background 0.1s;
  }
  .cell:last-child { border-right: none; }
  .cell.col-done   { background: #FAFAFA; }
  .cell.col-now    { background: #F0F4F8; }
  .cell.drag-over  { background: #EEF8F8; outline: 2px dashed var(--teal); outline-offset: -3px; }
  .wip-warning { font-size: 11px; color: var(--amber); padding: 5px 8px; background: var(--amber-bg); border-radius: 5px; text-align: center; }
  /* Priority badge on row header */
  .prio-badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 2px 7px; border-radius: 10px;
    font-size: 10px; font-weight: 700; color: var(--white);
    margin-bottom: 5px; flex-shrink: 0; width: fit-content;
  }
  .prio-1 { background: var(--red);  }
  .prio-2 { background: var(--teal); }
  .prio-3 { background: var(--gray); }

  /* Priority rule warning — cross-row */
  .prio-warning {
    font-size: 10.5px; color: var(--red); padding: 5px 8px;
    background: var(--red-bg); border-radius: 5px; text-align: center;
    border: 1px solid #F5C6C2;
  }

  /* Dim lower-priority Now cells when higher-priority rows are empty in Now */
  .cell.col-now.prio-blocked { background: #F7F7F7; opacity: 0.65; }
  .cell.col-next.prio-blocked { background: #F7F7F7; opacity: 0.65; }


  .later-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-content: flex-start;
  }
  .later-sub { display: contents; }


  .card {
    background: var(--white);
    border: 1px solid var(--lightgray);
    border-radius: 8px;
    padding: 10px 11px;
    cursor: grab;
    transition: box-shadow 0.15s, transform 0.1s;
    user-select: none;
  }
  .cell.col-later .card {
    min-width: 170px;
    flex: 1 1 170px;
    max-width: 187px;
  }
  .cell.col-later .add-card-btn {
    min-width: 120px;
    flex: 1 1 120px;
    max-width: 187px;
  }
  .card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.09); transform: translateY(-1px); }
  .card:active { cursor: grabbing; }
  .card.done-card { background: #F7F7F7; border-color: #E0E0E0; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--black); line-height: 1.35; flex: 1; }
  .done-card .card-title { color: var(--gray); text-decoration: line-through; }
  .rag-badge {
    width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
    margin-top: 2px; cursor: pointer; position: relative;
  }
  .rag-badge:hover::after {
    content: attr(data-tip);
    position: absolute; right: 14px; top: -2px;
    background: var(--black); color: var(--white);
    font-size: 10px; padding: 3px 7px; border-radius: 4px;
    white-space: nowrap; z-index: 20;
    font-family: var(--font);
    pointer-events: none;
  }
  .card-sub { display: flex; gap: 5px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
  .card-arr { font-size: 10px; font-weight: 600; font-family: var(--mono); padding: 2px 6px; border-radius: 4px; background: #FFF3F3; color: var(--red); }
  .card-arr.teal { background: var(--teal-bg); color: var(--teal); }
  .card-arr.gray { background: var(--offwhite); color: var(--gray); }
  .card-type-chip { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .type-HDC     { background: #FEF0E6; color: #A0522D; }
  .type-RAC     { background: #F3EAF8; color: #6B3FA0; }
  .type-CLANZ   { background: #E6F2EC; color: #1E7A3D; }
  .type-CLUK    { background: #E6EEF8; color: #1A4F8A; }
  .type-Platform{ background: var(--offwhite); color: var(--gray); }
  .type-NZ      { background: #E6F2EC; color: #1E7A3D; }
  .card-date { font-size: 10px; color: var(--gray); font-style: italic; margin-top: 3px; }
  .card-problem { font-size: 10.5px; color: var(--gray); line-height: 1.45; margin-top: 6px; border-top: 1px solid var(--lightgray); padding-top: 6px; }
  .done-stamp { font-size: 10px; color: var(--rag-green); font-weight: 600; margin-top: 4px; }

  .add-card-btn {
    width: 100%; padding: 7px;
    border: 1.5px dashed var(--lightgray); border-radius: 7px;
    background: none; color: var(--gray);
    font-family: var(--font); font-size: 11px;
    cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .add-card-btn:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-bg); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--white); border-radius: 12px; padding: 22px;
    width: 460px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
    transform: translateY(8px); transition: transform 0.15s;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  .form-row { margin-bottom: 11px; }
  label { display: block; font-size: 10px; font-weight: 600; color: var(--gray); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
  input, textarea, select {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--lightgray); border-radius: 6px;
    font-family: var(--font); font-size: 13px; color: var(--black);
    background: var(--offwhite); transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--teal); background: var(--white); }
  textarea { resize: vertical; min-height: 64px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rag-select { display: flex; gap: 7px; }
  .rag-opt {
    flex: 1; padding: 7px 4px; border: 1.5px solid var(--lightgray);
    border-radius: 6px; text-align: center; font-size: 10.5px; font-weight: 500;
    cursor: pointer; transition: all 0.12s; line-height: 1.35;
  }
  .rag-opt:hover { background: var(--offwhite); }
  .rag-opt.green.active { border-color: var(--rag-green); background: #EAF7EE; color: var(--rag-green); }
  .rag-opt.amber.active { border-color: var(--rag-amber); background: #FEF5E4; color: var(--rag-amber); }
  .rag-opt.red.active   { border-color: var(--rag-red);   background: #FDEDEB; color: var(--rag-red);   }
  .rag-context-note { font-size: 10px; color: var(--gray); margin-top: 5px; font-style: italic; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .btn { font-family: var(--font); font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--lightgray); background: var(--white); color: var(--black); cursor: pointer; transition: all 0.12s; }
  .btn:hover { background: var(--offwhite); }
  .btn-primary { background: var(--black); color: var(--white); border-color: var(--black); }
  .btn-primary:hover { background: #333; }
  .btn-delete { color: var(--red); border-color: #FDC0BA; background: #FFF5F4; margin-right: auto; }
  .btn-delete:hover { background: #FDEDEB; }

@media print {
  body { background: white; }
  .header { position: static; box-shadow: none; }
  .btn-export { display: none; }
  .modal-overlay { display: none !important; }
  .add-card-btn { display: none !important; }
  .grid-wrap { padding: 8px 12px; }
  .card { break-inside: avoid; }
  @page { size: A3 landscape; margin: 12mm; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js">

function exportPPTX() {
  try {
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_WIDE';

    const C = {
      black:'1A1A1A', white:'FFFFFF', offwhite:'F4F4F4', gray:'6B6B6B',
      lightgray:'E8E8E8', red:'C0392B', redbg:'FDECEA', teal:'0D7377',
      tealbg:'E8F4F8', slate:'F0F2F4', nowbg:'F0F4F8',
      ragG:'27AE60', ragA:'F39C12', ragR:'E74C3C',
    };

    const ROW_META = [
      { id:'keep',  label:'Priority 1 — Retain Key Customers',   sub:'Gross retention', color:C.red,  bg:C.redbg  },
      { id:'win',   label:'Priority 2 — Win Customers',    sub:'Sales win rate',  color:C.teal, bg:C.tealbg },
      { id:'scale', label:'Priority 3 — Scale Efficiently',sub:'Cost reduction',  color:C.gray, bg:C.slate  },
    ];

    const slide = pres.addSlide();
    slide.background = { color: C.white };

    const LBL_W  = 1.3;
    const COL_W  = 1.82;
    const HDR_H  = 0.36;
    const ROW_H  = 1.72;
    const SX     = 0.3;
    const SY     = 0.52;
    const GAP    = 0.02;

    // Title
    slide.addText('Evaran Group — Product Roadmap', {
      x:SX, y:0.1, w:12.73, h:0.3,
      fontFace:'Calibri', fontSize:13, color:C.black, bold:false
    });

    // Col header x positions
    const cx = {
      done:    SX + LBL_W + GAP,
      now:     SX + LBL_W + COL_W + GAP*2,
      next:    SX + LBL_W + COL_W*2 + GAP*3,
      'later-a': SX + LBL_W + COL_W*3 + GAP*4,
      'later-b': SX + LBL_W + COL_W*3.5 + GAP*5,
    };

    const colHdrs = [
      { id:'done',    x:cx.done,          w:COL_W,        label:'Done',  sub:'shipped',            bg:'EEEEEE', tx:C.gray  },
      { id:'now',     x:cx.now,           w:COL_W,        label:'Now',   sub:'delivery RAG',       bg:'2C3E50', tx:C.white },
      { id:'next',    x:cx.next,          w:COL_W,        label:'Next',  sub:'solution confidence',bg:C.tealbg, tx:C.teal  },
      { id:'later',   x:cx['later-a'],    w:COL_W*2+GAP,  label:'Later', sub:'ideas & future',     bg:C.offwhite,tx:C.gray },
    ];

    // Empty corner
    slide.addShape('rect', { x:SX, y:SY, w:LBL_W, h:HDR_H, fill:{color:C.offwhite}, line:{color:C.lightgray, width:0.5} });

    colHdrs.forEach(col => {
      slide.addShape('rect', { x:col.x, y:SY, w:col.w, h:HDR_H, fill:{color:col.bg}, line:{color:C.lightgray,width:0.5} });
      slide.addText(col.label, { x:col.x, y:SY+0.03, w:col.w, h:0.17, fontFace:'Calibri', fontSize:9, color:col.tx, bold:true, align:'center' });
      if (col.sub) slide.addText(col.sub, { x:col.x, y:SY+0.2, w:col.w, h:0.13, fontFace:'Calibri', fontSize:7, color:col.tx==='FFFFFF'?'F39C12':C.gray, align:'center' });
    });

    ROW_META.forEach((row, ri) => {
      const ry = SY + HDR_H + GAP + ri*(ROW_H+GAP);

      // Row label
      slide.addShape('rect', { x:SX, y:ry, w:LBL_W, h:ROW_H, fill:{color:row.bg}, line:{color:C.lightgray,width:0.5} });
      slide.addShape('rect', { x:SX, y:ry, w:0.05,  h:ROW_H, fill:{color:row.color}, line:{color:row.color,width:0} });
      slide.addText(row.label, { x:SX+0.08, y:ry+0.12, w:LBL_W-0.12, h:0.22, fontFace:'Calibri', fontSize:8, color:C.black, bold:true });
      slide.addText(row.sub,   { x:SX+0.08, y:ry+0.36, w:LBL_W-0.12, h:0.18, fontFace:'Calibri', fontSize:7, color:C.gray, italic:true });

      const cellDefs = [
        { colId:'done',    x:cx.done,          w:COL_W,       bg:'FAFAFA'    },
        { colId:'now',     x:cx.now,           w:COL_W,       bg:C.nowbg     },
        { colId:'next',    x:cx.next,          w:COL_W,       bg:C.white     },
        { colId:'later-a', x:cx['later-a'],    w:COL_W-GAP,   bg:C.white     },
        { colId:'later-b', x:cx['later-b'],    w:COL_W-GAP,   bg:C.white     },
      ];

      cellDefs.forEach(cell => {
        slide.addShape('rect', { x:cell.x, y:ry, w:cell.w, h:ROW_H, fill:{color:cell.bg}, line:{color:C.lightgray,width:0.5} });

        const rowCards = (cards[row.id][cell.colId] || []);
        rowCards.forEach((card, ci) => {
          const cardY = ry + 0.07 + ci * 0.8;
          if (cardY + 0.72 > ry + ROW_H - 0.05) return;
          const cw = cell.w - 0.1;
          const cx2 = cell.x + 0.05;

          slide.addShape('rect', { x:cx2, y:cardY, w:cw, h:0.72, fill:{color:C.white}, line:{color:C.lightgray,width:0.75} });

          const isLater = cell.colId.startsWith('later');
          const isDone  = cell.colId === 'done';
          if (!isLater && !isDone && card.rag) {
            const rc = {green:C.ragG, amber:C.ragA, red:C.ragR}[card.rag] || C.ragG;
            slide.addShape('ellipse', { x:cx2+cw-0.14, y:cardY+0.06, w:0.1, h:0.1, fill:{color:rc}, line:{color:rc,width:0} });
          }

          slide.addText(card.title||'', { x:cx2+0.05, y:cardY+0.04, w:cw-0.22, h:0.22, fontFace:'Calibri', fontSize:7, color:C.black, bold:true });
          if (card.arr)  slide.addText(card.arr,  { x:cx2+0.05, y:cardY+0.28, w:cw-0.1, h:0.14, fontFace:'Calibri', fontSize:6.5, color:C.red });
          if (card.date) slide.addText(card.date, { x:cx2+0.05, y:cardY+0.43, w:cw-0.1, h:0.12, fontFace:'Calibri', fontSize:6,   color:C.gray, italic:true });
          const tl = card.type==='CLL-ANZ'?'CLL ANZ':card.type==='CLL-UK'?'CLL UK':(card.type||'');
          if (tl) slide.addText(tl, { x:cx2+0.05, y:cardY+0.57, w:cw-0.1, h:0.12, fontFace:'Calibri', fontSize:6, color:C.gray });
        });
      });
    });

    // RAG legend
    const ly = 7.22;
    slide.addText('Now RAG:',  { x:SX,     y:ly, w:0.68, h:0.16, fontFace:'Calibri', fontSize:7.5, color:C.black, bold:true });
    slide.addText('Next RAG:', { x:SX+3.8, y:ly, w:0.68, h:0.16, fontFace:'Calibri', fontSize:7.5, color:C.black, bold:true });
    [['On track',C.ragG],['Date at risk',C.ragA],['Blocked',C.ragR]].forEach(([lbl,col],i) => {
      slide.addShape('ellipse', { x:SX+0.72+i*1.1, y:ly+0.04, w:0.09, h:0.09, fill:{color:col}, line:{color:col,width:0} });
      slide.addText(lbl, { x:SX+0.84+i*1.1, y:ly, w:0.95, h:0.16, fontFace:'Calibri', fontSize:7.5, color:C.gray });
    });
    [['High confidence',C.ragG],['Exploring',C.ragA],['Unclear',C.ragR]].forEach(([lbl,col],i) => {
      slide.addShape('ellipse', { x:SX+4.52+i*1.2, y:ly+0.04, w:0.09, h:0.09, fill:{color:col}, line:{color:col,width:0} });
      slide.addText(lbl, { x:SX+4.64+i*1.2, y:ly, w:1.05, h:0.16, fontFace:'Calibri', fontSize:7.5, color:C.gray });
    });

    pres.writeFile({ fileName:'Evaran_Product_Roadmap.pptx' });
  } catch(e) {
    alert('Export failed: ' + e.message);
    console.error(e);
  }
}

</script>

<body>

          <option value="NZ">NZ</option>
        </select>
      </div>
    </div>
    <div class="form-row" id="date-row">
      <label id="date-label">Target Go-live</label>
      <input type="text" id="f-date" placeholder="e.g. Q3 2026">
    </div>
    <div class="form-row" id="rag-row">
      <label id="rag-label">RAG Status</label>
      <div class="rag-select">
        <div class="rag-opt green active" data-rag="green" id="rag-green" onclick="selectRag('green')"></div>
        <div class="rag-opt amber"        data-rag="amber" id="rag-amber" onclick="selectRag('amber')"></div>
        <div class="rag-opt red"          data-rag="red"   id="rag-red"   onclick="selectRag('red')"></div>
      </div>
      <div class="rag-context-note" id="rag-note"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-delete" id="btn-delete" onclick="deleteCard()" style="display:none">Delete</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCard()">Save</button>
    </div>
  </div>
</div>

<script>
const RAG_CTX = {
  done:  { label:'Status',              note:'',                                                    opts:['Shipped','Partially shipped','Reverted'] },
  now:   { label:'Delivery RAG',        note:'Confidence in hitting the go-live date range.',        opts:['On track for target date','Date at risk','Blocked / slipped'] },
  next:  { label:'Solution Confidence', note:'How well we understand the solution, not delivery.',   opts:['High confidence — solution clear','Exploring solutions','Problem still unclear'] },
  later: { label:'Definition Status',   note:'',                                                    opts:['Well defined','Partially defined','Needs discovery'] },
};

const ROWS = [
  {
    id:'keep',  label:'Retain Key Customers',    sub:'Gross retention', cls:'row-keep',  arrClass:'',     prio:1,
    why:'We have deep trust issues with our largest customers. Fixing what is broken and completing the eCase → CLL migration — including all the CLL feature work that gates migration — is the most direct path to protecting $2.5M+ in existing ARR and rebuilding confidence in the platform.'
  },
  {
    id:'win',   label:'Win Customers',     sub:'New logo & expansion', cls:'row-win',   arrClass:'teal', prio:2,
    why:'Prospects need to see a modern, capable product before they sign. This row is about new and updated modules across all our products that make us compelling to buy. CLL migration lives in Priority 1 — it is a retention play for existing customers, not a new logo story.'
  },
  {
    id:'scale', label:'Scale Efficiently', sub:'Cost reduction',  cls:'row-scale', arrClass:'gray', prio:3,
    why:'Platform health and onboarding efficiency unlock margin and delivery speed, but only matter once we have customers worth retaining and growing. Infrastructure investment is sequenced to support the migration, not compete with it for engineering capacity.'
  },
];

let cards = {
  keep: {
    done:     [{ id:'c1',  title:'NZ eCase Config', arr:'$330k migration ARR', type:'NZ', rag:'green', date:'Shipped Q1 2026', problem:'NZ customers needed initial CLL configuration to commence migration testing.' }],
    now:      [
      { id:'c2', title:'Fix Award Interpreter, Rostering & Claiming', arr:'$544k ARR at risk', type:'HDC', rag:'amber', date:'Q2 2026', problem:'Amana, Helping Hand and LDK cannot process claims correctly. ~$30k/month in manual workarounds and active legal claims.' },
      { id:'c3', title:'RAC Finance Module', arr:'$330k ARR backlog', type:'RAC', rag:'green', date:'Q3 2026', problem:'12 customers sold RAC Finance that has not been built. Renewal risk grows each month.' },
    ],
    next:     [{ id:'c4',  title:'FHIR & Aged Care Act Compliance', arr:'Regulatory deadline', type:'HDC', rag:'amber', date:'', problem:'Mandatory government compliance for all HDC operators. Non-compliance creates legal exposure for customers.' }],
    'later-a':[{ id:'c5',  title:'CLL Migration — AU SME Customers', arr:'$248k–$620k ARR', type:'CLL-ANZ', rag:'green', date:'Q4 2026', problem:'Small and mid-size AU customers move from eCase to CLL before HDC sustain mode begins.' },
               { id:'c14', title:'Support at Home E2E', arr:'Unlocks SaH migration', type:'CLL-ANZ', rag:'green', date:'Q3 2026', problem:'Existing HDC customers on SaH funding cannot migrate to CLL without end-to-end SaH billing. This gates the migration sequence, not new logo acquisition.' },
               { id:'c15', title:'CHSP + SA Integration', arr:'Gates CHSP migration', type:'CLL-ANZ', rag:'amber', date:'Q4 2026', problem:'CHSP-funded customers cannot move to CLL until funding integrations are in place. Migration dependency.' }],
    'later-b':[{ id:'c5b', title:'CLL Migration — Enterprise', arr:'$1M+ ARR', type:'CLL-ANZ', rag:'amber', date:'Q1 2027', problem:'Large AU customers (Amana, Helping Hand) migrate after CLL functional depth is proven on SME wave.' },
               { id:'c16', title:'Group Bookings + Employee Self-Service', arr:'Migration gate', type:'CLL-ANZ', rag:'amber', date:'Q4 2026', problem:'Required by several HDC customers before they can migrate. Blocking migration for a segment of the customer base.' },
               { id:'c17', title:'RAC/RV Integration', arr:'Dual HDC/RAC customers', type:'CLL-ANZ', rag:'amber', date:'Q1 2027', problem:'Helping Hand and Amana need CLL/RAC interoperability before they can fully migrate off eCase HDC.' }],
  },
  win: {
    done:     [],
    now:      [],
    next:     [{ id:'c8',  title:'Care Plan Updates', arr:'Competitive parity', type:'CLL-ANZ', rag:'green', date:'', problem:'Prospects evaluating CLL expect modern care planning tools. Absence of this capability is cited as a gap in sales conversations.' }],
    'later-a':[{ id:'c8b', title:'MOA Integration', arr:'TBD', type:'CLL-UK', rag:'amber', date:'', problem:'MOA integration would open new customer segments. Needs scoping — CLL UK dependency.' }],
    'later-b':[{ id:'c13b', title:'AI Scribe', arr:'Premium feature', type:'CLL-ANZ', rag:'amber', date:'', problem:'Clinical documentation is highly manual. AI scribe is a differentiating feature prospects want to see before committing to CLL.' }],
  },
  scale: {
    done:     [],
    now:      [{ id:'c10', title:'AWS Migration Phase 1', arr:'$260k cost saving', type:'Platform', rag:'green', date:'Q2 2026', problem:'Current infrastructure is expensive and limits deployment speed. AWS reduces ops cost and improves reliability.' }],
    next:     [{ id:'c11', title:'PHP Upgrade', arr:'Risk reduction', type:'Platform', rag:'amber', date:'', problem:'PHP version end-of-life creates security exposure. Required before it becomes a critical risk.' }],
    'later-a':[{ id:'c12', title:'Onboarding Automation', arr:'~$50k/customer saving', type:'Platform', rag:'green', date:'H2 2027', problem:'Manual onboarding costs significant implementation hours. Automation reduces time-to-value and headcount dependency.' }],
    'later-b':[{ id:'c13', title:'AI Scribe', arr:'Premium feature', type:'CLL-ANZ', rag:'amber', date:'', problem:'Clinical documentation is highly manual. AI scribe could reduce worker hours and be a differentiating premium feature.' }],
  },
};

let editingId=null, editingRow=null, editingCol=null, selectedRag='green';
let dragCard=null, dragRow=null, dragCol=null, idCounter=30;

function typeClass(t) {
  return {'HDC':'type-HDC','RAC':'type-RAC','CLL-ANZ':'type-CLANZ','CLL-UK':'type-CLUK','Platform':'type-Platform','NZ':'type-NZ'}[t]||'type-Platform';
}
function typeLabel(t) {
  return {'CLL-ANZ':'CLL ANZ','CLL-UK':'CLL UK'}[t]||t;
}
function ctxKey(col) { return col.startsWith('later') ? 'later' : col; }

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  grid.innerHTML = `
    <div class="col-header row-corner"></div>
    <div class="col-header col-done"><div class="col-title">Done</div><div class="col-sub">Shipped · last 90 days</div></div>
    <div class="col-header col-now"><div class="col-title">Now</div><div class="col-sub">⚠ Max 2 per product · delivery RAG</div></div>
    <div class="col-header col-next"><div class="col-title" style="color:var(--teal)">Next</div><div class="col-sub">⚠ Max 2 per product · solution confidence RAG</div></div>
    <div class="col-header col-later" style="border-right:none"><div class="col-title">Later</div><div class="col-sub">Ideas &amp; future thinking</div></div>
  `;

  ROWS.forEach(row => {
    const rh = document.createElement('div');
    rh.className = `row-header ${row.cls}`;
    rh.innerHTML = `<div class="prio-badge prio-${row.prio}">Priority ${row.prio}</div><div class="row-title">${row.label}</div><div class="row-lens">${row.sub}</div><div class="row-why">${row.why}</div>`;
    grid.appendChild(rh);

    ['done','now','next'].forEach(col => {
      // Cross-priority check for Now and Next
      const prioBreach = (col === 'now' || col === 'next') && row.prio > 1 && (() => {
        // Check if any higher-priority row has NO items in this column (for any shared product type)
        const higherRows = ROWS.filter(r => r.prio < row.prio);
        const myTypes = (cards[row.id][col]||[]).map(c => c.type);
        if (!myTypes.length) return false;
        return higherRows.some(hr => {
          const hrTypes = (cards[hr.id][col]||[]).map(c => c.type);
          // Breach if this row has a product type in Now/Next that a higher-priority row has 0 of
          return myTypes.some(t => !hrTypes.includes(t) && (cards[hr.id][col]||[]).length === 0);
        });
      })();
      const cell = document.createElement('div');
      cell.className = `cell col-${col}${prioBreach ? ' prio-blocked' : ''}`;
      cell.dataset.row = row.id;
      cell.dataset.col = col;
      setupDrop(cell);
      if (prioBreach && (col === 'now' || col === 'next')) {
        const pw = document.createElement('div');
        pw.className = 'prio-warning';
        const higherLabel = ROWS.filter(r => r.prio < row.prio).map(r => r.label).join(', ');
        pw.textContent = `⚠ ${higherLabel} should be prioritised first`;
        cell.appendChild(pw);
      }

      if (col === 'now' || col === 'next') {
        const colCards = cards[row.id][col] || [];
        const typeCounts = {};
        colCards.forEach(c => { typeCounts[c.type] = (typeCounts[c.type]||0) + 1; });
        const overLimit = Object.entries(typeCounts).filter(([,n]) => n >= 2).map(([t]) => t);
        if (overLimit.length) {
          const w = document.createElement('div');
          w.className = 'wip-warning';
          w.textContent = `WIP limit reached for: ${overLimit.join(', ')} (max 2 per product)`;
          cell.appendChild(w);
        }
      }

      (cards[row.id][col]||[]).forEach(card => cell.appendChild(makeCard(card, row, col)));

      if (col !== 'done') {
        const btn = document.createElement('button');
        btn.className = 'add-card-btn';
        btn.textContent = '+ Add item';
        btn.onclick = () => openModal(null, row.id, col);
        cell.appendChild(btn);
      }
      grid.appendChild(cell);
    });

    // Later — wide cell with two sub-columns
    const laterCell = document.createElement('div');
    laterCell.className = 'cell col-later';
    laterCell.style.borderRight = 'none';
    const inner = document.createElement('div');
    inner.className = 'later-inner';

    ['later-a','later-b'].forEach((subCol, si) => {
      const sub = document.createElement('div');
      sub.className = 'later-sub';
      sub.dataset.row = row.id;
      sub.dataset.col = subCol;
      setupDrop(sub);

      (cards[row.id][subCol]||[]).forEach(card => sub.appendChild(makeCard(card, row, subCol)));

      const btn = document.createElement('button');
      btn.className = 'add-card-btn';
      btn.textContent = '+ Add item';
      btn.onclick = () => openModal(null, row.id, subCol);
      sub.appendChild(btn);

      inner.appendChild(sub);
    });

    laterCell.appendChild(inner);
    grid.appendChild(laterCell);
  });
}

function makeCard(card, row, col) {
  const el = document.createElement('div');
  el.className = `card${col==='done'?' done-card':''}`;
  el.draggable = true;
  el.dataset.id = card.id;

  const ragColor = {green:'var(--rag-green)',amber:'var(--rag-amber)',red:'var(--rag-red)'}[card.rag]||'var(--rag-green)';
  const ctx = RAG_CTX[ctxKey(col)];
  const ragIdx = {green:0,amber:1,red:2}[card.rag]||0;
  const ragTip = ctx.opts[ragIdx];
  const arrCls = (card.type==='Platform'||card.type==='NZ') ? 'gray' : (row.arrClass||'');
  const showDate = card.date && col !== 'done';
  const icon = '🎯';

  el.innerHTML = `
    <div class="card-header">
      <div class="card-title">${card.title}</div>
      ${(col === 'later-a' || col === 'later-b') ? '' : `<div class="rag-badge" style="background:${ragColor}" data-tip="${ragTip}" onclick="cycleRag(event,'${card.id}','${row.id}','${col}')"></div>`}
    </div>
    <div class="card-sub">
      ${card.arr ? `<span class="card-arr ${arrCls}">${card.arr}</span>` : ''}
      <span class="card-type-chip ${typeClass(card.type)}">${typeLabel(card.type)}</span>
    </div>
    ${showDate ? `<div class="card-date">${icon} ${card.date}</div>` : ''}
    ${card.problem ? `<div class="card-problem">${card.problem}</div>` : ''}
    ${col==='done' ? '<div class="done-stamp">✓ Shipped</div>' : ''}
  `;

  el.onclick = e => { if (!e.target.classList.contains('rag-badge')) openModal(card.id, row.id, col); };
  el.addEventListener('dragstart', e => {
    dragCard=card.id; dragRow=row.id; dragCol=col;
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>el.style.opacity='0.4',0);
  });
  el.addEventListener('dragend', ()=>{ el.style.opacity='1'; });
  return el;
}

function setupDrop(el) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('drag-over');
    if (!dragCard) return;
    const tr = el.dataset.row, tc = el.dataset.col;
    if (!tr || !tc || (tr===dragRow && tc===dragCol)) return;
    if (tc==='now' || tc==='next') {
      const movedType = (cards[dragRow][dragCol]||[]).find(c=>c.id===dragCard)?.type;
      const sameType = (cards[tr][tc]||[]).filter(c=>c.type===movedType).length;
      if (sameType >= 2) { alert(`WIP limit reached for ${movedType} in ${tc} — max 2 per product type.`); return; }
    }
    const src = cards[dragRow][dragCol]||[];
    const idx = src.findIndex(c=>c.id===dragCard);
    if (idx===-1) return;
    const [moved] = src.splice(idx,1);
    if (!cards[tr][tc]) cards[tr][tc]=[];
    cards[tr][tc].push(moved);
    render(); dragCard=null;
  });
}

function cycleRag(e, id, row, col) {
  e.stopPropagation();
  const card=(cards[row][col]||[]).find(c=>c.id===id);
  if (!card) return;
  card.rag={green:'amber',amber:'red',red:'green'}[card.rag]||'green';
  render();
}

function updateModalRag(col) {
  const ctx = RAG_CTX[ctxKey(col)] || RAG_CTX.later;
  document.getElementById('rag-label').textContent = ctx.label;
  document.getElementById('rag-note').textContent  = ctx.note;
  document.getElementById('rag-green').textContent = ctx.opts[0];
  document.getElementById('rag-amber').textContent = ctx.opts[1];
  document.getElementById('rag-red').textContent   = ctx.opts[2];
  const isNow = col==='now';
  document.getElementById('date-label').textContent = isNow ? 'Target Go-live' : 'Indicative Timeframe';
  document.getElementById('f-date').placeholder = isNow ? 'e.g. Q3 2026' : 'e.g. H1 2027 (optional)';
  document.getElementById('date-row').style.display = col==='done' ? 'none' : '';
  const ragRow = document.getElementById('rag-row');
  if (ragRow) ragRow.style.display = (col==='later-a'||col==='later-b') ? 'none' : '';
}

function openModal(id, row, col) {
  editingId=id; editingRow=row; editingCol=col;
  updateModalRag(col);
  document.getElementById('btn-delete').style.display = id ? 'inline-block' : 'none';
  if (id) {
    const card=(cards[row][col]||[]).find(c=>c.id===id);
    document.getElementById('modal-title').textContent='Edit Card';
    document.getElementById('f-title').value   = card.title||'';
    document.getElementById('f-problem').value = card.problem||'';
    document.getElementById('f-arr').value     = card.arr||'';
    document.getElementById('f-type').value    = card.type||'CLL-ANZ';
    document.getElementById('f-date').value    = card.date||'';
    selectRag(card.rag||'green');
  } else {
    document.getElementById('modal-title').textContent='Add Card';
    ['f-title','f-problem','f-arr','f-date'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-type').value='CLL-ANZ';
    selectRag('green');
  }
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),80);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId=editingRow=editingCol=null;
}

function selectRag(val) {
  selectedRag=val;
  document.querySelectorAll('.rag-opt').forEach(el=>el.classList.toggle('active',el.dataset.rag===val));
}

function saveCard() {
  const title=document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  const data = {
    title, problem:document.getElementById('f-problem').value.trim(),
    arr:document.getElementById('f-arr').value.trim(),
    type:document.getElementById('f-type').value,
    date:document.getElementById('f-date').value.trim(),
    rag:selectedRag,
  };
  if (editingId) {
    const card=(cards[editingRow][editingCol]||[]).find(c=>c.id===editingId);
    if (card) Object.assign(card,data);
  } else {
    if (editingCol==='now'||editingCol==='next') {
      const t = document.getElementById('f-type').value;
      const existing = (cards[editingRow][editingCol]||[]).filter(c=>c.type===t && c.id!==editingId).length;
      if (existing >= 2) { alert(`WIP limit reached for ${t} in ${editingCol} — max 2 per product type.`); return; }
    }
    if (!cards[editingRow][editingCol]) cards[editingRow][editingCol]=[];
    cards[editingRow][editingCol].push({id:'c'+(++idCounter),...data});
  }
  closeModal(); render();
}

function deleteCard() {
  if (!editingId) return;
  const arr=cards[editingRow][editingCol]||[];
  const idx=arr.findIndex(c=>c.id===editingId);
  if (idx>-1) arr.splice(idx,1);
  closeModal(); render();
}

document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.metaKey)saveCard();});

render();

function exportPDF() {
  // Hide interactive UI elements not needed in print
  const btns = document.querySelectorAll('.add-card-btn');
  btns.forEach(b => b.style.display = 'none');
  const modal = document.getElementById('modal-overlay');
  modal.style.display = 'none';
  // Trigger print dialog (browsers can save as PDF)
  window.print();
  // Restore after print
  setTimeout(() => {
    btns.forEach(b => b.style.display = '');
    modal.style.display = '';
  }, 1000);
}


function exportPPTX() {
  try {
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_WIDE';

    const C = {
      black:'1A1A1A', white:'FFFFFF', offwhite:'F4F4F4', gray:'6B6B6B',
      lightgray:'E8E8E8', red:'C0392B', redbg:'FDECEA', teal:'0D7377',
      tealbg:'E8F4F8', slate:'F0F2F4', nowbg:'F0F4F8',
      ragG:'27AE60', ragA:'F39C12', ragR:'E74C3C',
    };

    const ROW_META = [
      { id:'keep',  label:'Priority 1 — Retain Key Customers',   sub:'Gross retention', color:C.red,  bg:C.redbg  },
      { id:'win',   label:'Priority 2 — Win Customers',    sub:'Sales win rate',  color:C.teal, bg:C.tealbg },
      { id:'scale', label:'Priority 3 — Scale Efficiently',sub:'Cost reduction',  color:C.gray, bg:C.slate  },
    ];

    const slide = pres.addSlide();
    slide.background = { color: C.white };

    const LBL_W  = 1.3;
    const COL_W  = 1.82;
    const HDR_H  = 0.36;
    const ROW_H  = 1.72;
    const SX     = 0.3;
    const SY     = 0.52;
    const GAP    = 0.02;

    // Title
    slide.addText('Evaran Group — Product Roadmap', {
      x:SX, y:0.1, w:12.73, h:0.3,
      fontFace:'Calibri', fontSize:13, color:C.black, bold:false
    });

    // Col header x positions
    const cx = {
      done:    SX + LBL_W + GAP,
      now:     SX + LBL_W + COL_W + GAP*2,
      next:    SX + LBL_W + COL_W*2 + GAP*3,
      'later-a': SX + LBL_W + COL_W*3 + GAP*4,
      'later-b': SX + LBL_W + COL_W*3.5 + GAP*5,
    };

    const colHdrs = [
      { id:'done',    x:cx.done,          w:COL_W,        label:'Done',  sub:'shipped',            bg:'EEEEEE', tx:C.gray  },
      { id:'now',     x:cx.now,           w:COL_W,        label:'Now',   sub:'delivery RAG',       bg:'2C3E50', tx:C.white },
      { id:'next',    x:cx.next,          w:COL_W,        label:'Next',  sub:'solution confidence',bg:C.tealbg, tx:C.teal  },
      { id:'later',   x:cx['later-a'],    w:COL_W*2+GAP,  label:'Later', sub:'ideas & future',     bg:C.offwhite,tx:C.gray },
    ];

    // Empty corner
    slide.addShape('rect', { x:SX, y:SY, w:LBL_W, h:HDR_H, fill:{color:C.offwhite}, line:{color:C.lightgray, width:0.5} });

    colHdrs.forEach(col => {
      slide.addShape('rect', { x:col.x, y:SY, w:col.w, h:HDR_H, fill:{color:col.bg}, line:{color:C.lightgray,width:0.5} });
      slide.addText(col.label, { x:col.x, y:SY+0.03, w:col.w, h:0.17, fontFace:'Calibri', fontSize:9, color:col.tx, bold:true, align:'center' });
      if (col.sub) slide.addText(col.sub, { x:col.x, y:SY+0.2, w:col.w, h:0.13, fontFace:'Calibri', fontSize:7, color:col.tx==='FFFFFF'?'F39C12':C.gray, align:'center' });
    });

    ROW_META.forEach((row, ri) => {
      const ry = SY + HDR_H + GAP + ri*(ROW_H+GAP);

      // Row label
      slide.addShape('rect', { x:SX, y:ry, w:LBL_W, h:ROW_H, fill:{color:row.bg}, line:{color:C.lightgray,width:0.5} });
      slide.addShape('rect', { x:SX, y:ry, w:0.05,  h:ROW_H, fill:{color:row.color}, line:{color:row.color,width:0} });
      slide.addText(row.label, { x:SX+0.08, y:ry+0.12, w:LBL_W-0.12, h:0.22, fontFace:'Calibri', fontSize:8, color:C.black, bold:true });
      slide.addText(row.sub,   { x:SX+0.08, y:ry+0.36, w:LBL_W-0.12, h:0.18, fontFace:'Calibri', fontSize:7, color:C.gray, italic:true });

      const cellDefs = [
        { colId:'done',    x:cx.done,          w:COL_W,       bg:'FAFAFA'    },
        { colId:'now',     x:cx.now,           w:COL_W,       bg:C.nowbg     },
        { colId:'next',    x:cx.next,          w:COL_W,       bg:C.white     },
        { colId:'later-a', x:cx['later-a'],    w:COL_W-GAP,   bg:C.white     },
        { colId:'later-b', x:cx['later-b'],    w:COL_W-GAP,   bg:C.white     },
      ];

      cellDefs.forEach(cell => {
        slide.addShape('rect', { x:cell.x, y:ry, w:cell.w, h:ROW_H, fill:{color:cell.bg}, line:{color:C.lightgray,width:0.5} });

        const rowCards = (cards[row.id][cell.colId] || []);
        rowCards.forEach((card, ci) => {
          const cardY = ry + 0.07 + ci * 0.8;
          if (cardY + 0.72 > ry + ROW_H - 0.05) return;
          const cw = cell.w - 0.1;
          const cx2 = cell.x + 0.05;

          slide.addShape('rect', { x:cx2, y:cardY, w:cw, h:0.72, fill:{color:C.white}, line:{color:C.lightgray,width:0.75} });

          const isLater = cell.colId.startsWith('later');
          const isDone  = cell.colId === 'done';
          if (!isLater && !isDone && card.rag) {
            const rc = {green:C.ragG, amber:C.ragA, red:C.ragR}[card.rag] || C.ragG;
            slide.addShape('ellipse', { x:cx2+cw-0.14, y:cardY+0.06, w:0.1, h:0.1, fill:{color:rc}, line:{color:rc,width:0} });
          }

          slide.addText(card.title||'', { x:cx2+0.05, y:cardY+0.04, w:cw-0.22, h:0.22, fontFace:'Calibri', fontSize:7, color:C.black, bold:true });
          if (card.arr)  slide.addText(card.arr,  { x:cx2+0.05, y:cardY+0.28, w:cw-0.1, h:0.14, fontFace:'Calibri', fontSize:6.5, color:C.red });
          if (card.date) slide.addText(card.date, { x:cx2+0.05, y:cardY+0.43, w:cw-0.1, h:0.12, fontFace:'Calibri', fontSize:6,   color:C.gray, italic:true });
          const tl = card.type==='CLL-ANZ'?'CLL ANZ':card.type==='CLL-UK'?'CLL UK':(card.type||'');
          if (tl) slide.addText(tl, { x:cx2+0.05, y:cardY+0.57, w:cw-0.1, h:0.12, fontFace:'Calibri', fontSize:6, color:C.gray });
        });
      });
    });

    // RAG legend
    const ly = 7.22;
    slide.addText('Now RAG:',  { x:SX,     y:ly, w:0.68, h:0.16, fontFace:'Calibri', fontSize:7.5, color:C.black, bold:true });
    slide.addText('Next RAG:', { x:SX+3.8, y:ly, w:0.68, h:0.16, fontFace:'Calibri', fontSize:7.5, color:C.black, bold:true });
    [['On track',C.ragG],['Date at risk',C.ragA],['Blocked',C.ragR]].forEach(([lbl,col],i) => {
      slide.addShape('ellipse', { x:SX+0.72+i*1.1, y:ly+0.04, w:0.09, h:0.09, fill:{color:col}, line:{color:col,width:0} });
      slide.addText(lbl, { x:SX+0.84+i*1.1, y:ly, w:0.95, h:0.16, fontFace:'Calibri', fontSize:7.5, color:C.gray });
    });
    [['High confidence',C.ragG],['Exploring',C.ragA],['Unclear',C.ragR]].forEach(([lbl,col],i) => {
      slide.addShape('ellipse', { x:SX+4.52+i*1.2, y:ly+0.04, w:0.09, h:0.09, fill:{color:col}, line:{color:col,width:0} });
      slide.addText(lbl, { x:SX+4.64+i*1.2, y:ly, w:1.05, h:0.16, fontFace:'Calibri', fontSize:7.5, color:C.gray });
    });

    pres.writeFile({ fileName:'Evaran_Product_Roadmap.pptx' });
  } catch(e) {
    alert('Export failed: ' + e.message);
    console.error(e);
  }
}

</script>
